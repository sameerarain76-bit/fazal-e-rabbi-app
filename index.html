<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17643d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fazal Stock 27"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Fazal e Rabbi Tradders • Master 27</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183b2d;background:#f3f7f3}*{box-sizing:border-box}body{margin:0;padding:0 0 85px}header{position:sticky;top:0;background:#16623b;color:#fff;padding:17px 17px 15px;z-index:2}header b{font-size:20px}header small{display:block;opacity:.85;margin-top:3px}main{max-width:780px;margin:auto;padding:15px}.card{background:#fff;border-radius:16px;padding:17px;margin:0 0 13px;box-shadow:0 1px 7px #233b3020}.card h2{margin:0 0 14px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid #dce9df;padding:17px 10px;border-radius:14px;background:#fff;text-align:left;color:#17442e;min-height:110px}.tile b{display:block;font-size:17px;margin-top:7px}.tile small{display:block;color:#627267;font-size:12px;margin-top:4px}.big{font-size:26px;font-weight:800;margin:4px 0}.green{color:#157144}.red{color:#ba2d35}.muted{color:#637568;font-size:13px;line-height:1.55}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.metric{background:#eef6ef;border-radius:12px;padding:13px;min-width:0}.metric b{display:block;font-size:20px;overflow-wrap:anywhere}.metric small{font-size:12px;color:#52695b}.entry{padding:12px 0;border-bottom:1px solid #e7eee9}.entry:last-child{border:0}.entry b{display:block}.entry small{color:#627266;display:block;margin-top:4px;line-height:1.5}button{font:inherit;font-weight:650;cursor:pointer;background:#176b40;border:0;color:white;border-radius:10px;padding:12px 14px}button.secondary{background:#e7f2e9;color:#1b5738}button.warn{background:#fff0ee;color:#9c2923}button:disabled{opacity:.45}input,select,textarea{width:100%;display:block;padding:12px;margin:5px 0 14px;border:1px solid #c9d9cf;border-radius:9px;background:white;font:inherit}label{font-size:13px;font-weight:700;display:block}nav{position:fixed;bottom:0;background:#fff;border-top:1px solid #dde7e0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:3}nav button{background:white;color:#365b44;border-radius:0;font-size:11px;padding:12px 0}nav button.active{color:#0a7b3d;background:#eff8f0}.help{padding:10px 12px;background:#fff8e9;border-radius:9px;font-size:12px;line-height:1.5;color:#7b5b19}.stamp{display:inline-block;padding:4px 7px;background:#eaf4ec;border-radius:8px;font-size:11px}dialog{border:0;border-radius:16px;padding:20px;width:min(96vw,540px);max-height:87vh;overflow:auto;box-shadow:0 0 0 100vmax #0007}dialog h2{margin-top:0}.footer{display:flex;justify-content:flex-end;gap:9px;margin-top:13px}.product-line{border:1px solid #dce7df;border-radius:10px;padding:12px;margin:9px 0;background:#f8faf8}.product-line .remove{float:right;padding:5px 9px}.hidden{display:none!important}@media print{header,nav,main,dialog{display:none!important}body{background:white;padding:0}#printArea{display:block!important}#printArea *{color:#111!important}}#printArea{display:none}.printpage{font-family:serif;font-size:12px;padding:20px;direction:rtl}.printpage h1,.printpage h2{text-align:center;margin:6px}.printpage h1{color:#17643d!important}.printpage .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}.printpage .summary div{border:1px solid #ddd;padding:10px}.printpage table{width:100%;border-collapse:collapse;margin-top:14px}.printpage th,.printpage td{border:1px solid #bbb;padding:8px;text-align:right}.printpage .ltr{direction:ltr;display:inline-block}
</style></head><body><header><b>🌿 Fazal e Rabbi Tradders</b><small>Master 27 • Simple Stock Register</small></header><main id="root"></main><nav id="nav"></nav><dialog id="dlg"><h2 id="dlgTitle"></h2><form id="frm"><div id="fields"></div><div class="footer"><button type="button" class="secondary" onclick="document.getElementById('dlg').close()">Cancel</button><button type="submit">Save</button></div></form></dialog><div id="printArea"></div><script>
'use strict';
const KEY='fazal-master27-stock-v1';const empty=()=>({suppliers:[],products:[],purchases:[],movements:[],payments:[],adjustments:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||empty()}catch{db=empty()}for(let k of Object.keys(empty()))if(!Array.isArray(db[k]))db[k]=[];
let page='home',supplierFilter='',selectedExpiry='all';const $=s=>document.querySelector(s),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),today=()=>new Date().toLocaleDateString('en-CA'),stamp=()=>new Date().toISOString(),num=x=>Number(x||0),money=n=>'Rs '+num(n).toLocaleString('en-PK',{maximumFractionDigits:2}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function product(pid){return db.products.find(x=>x.id===pid)}function supplier(sid){return db.suppliers.find(x=>x.id===sid)}function stockValue(sid=''){return db.products.filter(p=>!sid||p.supplierId===sid).reduce((t,p)=>t+num(p.qty)*num(p.cost),0)}function payable(sid){return db.purchases.filter(x=>x.supplierId===sid).reduce((t,x)=>t+x.total,0)-db.payments.filter(x=>x.supplierId===sid).reduce((t,x)=>t+x.amount,0)-db.adjustments.filter(x=>x.supplierId===sid).reduce((t,x)=>t+x.amount,0)}function totalPayable(){return db.suppliers.reduce((v,s)=>v+payable(s.id),0)}
const title=(name,html)=>`<section class="card"><h2>${name}</h2>${html}</section>`;function btn(s,code,cl=''){return `<button class="${cl}" onclick="${code}">${s}</button>`}function metric(n,v,cl=''){return `<div class="metric"><small>${n}</small><b class="${cl}">${v}</b></div>`};function dateDiff(date){if(!date)return Infinity;const d=new Date(date+'T12:00:00'),a=new Date(today()+'T12:00:00');return Math.ceil((d-a)/86400000)}
function render(){let h='';if(page==='home'){h=title('Home Page',`<div class="grid">${[['📦','Stock','stock','Stock In / Out'],['⏰','Expiry','expiry','Separate expiry alerts'],['🚚','Suppliers','suppliers','Multiple purchases'],['📗','Supplier Khata','khata','Udhaar & payments'],['💰','Stock Value','value','Remaining cost'],['📄','PDF Statement','statement','Print / WhatsApp']].map(x=>`<button class="tile" onclick="go('${x[2]}')">${x[0]}<b>${x[1]}</b><small>${x[3]}</small></button>`).join('')}</div>`)+title('Shop Summary',`<div class="grid">${metric('Total Remaining Stock',money(stockValue()),'green')}${metric('Total Supplier Udhaar',money(totalPayable()),'red')}${metric('Expiry within 90 days',db.products.filter(p=>p.qty>0&&dateDiff(p.expiry)>=0&&dateDiff(p.expiry)<=90).length)}${metric('Expired Batches',db.products.filter(p=>p.qty>0&&dateDiff(p.expiry)<0).length,'red')}</div>`)}
if(page==='stock')h=title('Stock Register',`<div class="row">${btn('+ Stock In / Multiple Purchase','openPurchase()')}${btn('Stock Out','openOut()','secondary')}</div><p class="muted">No sale prices or sale invoices. Product quantity and purchase cost only.</p>`+stockRows());
if(page==='expiry'){let ps=db.products.filter(p=>p.qty>0&&p.expiry).sort((a,b)=>a.expiry.localeCompare(b.expiry));h=title('Expiry — Separate from Stock',`<p class="muted">90-day expiry warning. Date is saved on each batch when stock arrives.</p><div class="row">${btn('All',"selectedExpiry='all';render()",selectedExpiry==='all'?'':'secondary')}${btn('Within 90 Days',"selectedExpiry='soon';render()",selectedExpiry==='soon'?'':'secondary')}${btn('Expired',"selectedExpiry='expired';render()",selectedExpiry==='expired'?'':'secondary')}</div>`+(ps.filter(p=>selectedExpiry==='all'||(selectedExpiry==='soon'&&dateDiff(p.expiry)>=0&&dateDiff(p.expiry)<=90)||(selectedExpiry==='expired'&&dateDiff(p.expiry)<0)).map(p=>`<div class="entry"><b>${esc(p.name)}</b><small>${esc(supplier(p.supplierId)?.name)} · ${p.qty} ${esc(p.unit)} · Expiry: ${esc(p.expiry)} · ${dateDiff(p.expiry)<0?'🔴 Expired':dateDiff(p.expiry)<=90?'🟠 Expiring soon':'🟢 OK'}</small></div>`).join('')||'<p class="muted">No matching expiry entries.</p>'))}
if(page==='suppliers'||page==='khata'||page==='value'||page==='statement'){const btns=page==='suppliers'?`${btn('+ New Supplier','openSupplier()')}${btn('+ Multiple Purchase','openPurchase()','secondary')}`:page==='khata'?`${btn('Supplier Payment','openPayment()')}${btn('Return Credit','openCredit()','secondary')}`:page==='statement'?`${btn('Generate Statement','makeStatement()')}`:'';
h=title(({suppliers:'Suppliers',khata:'Supplier Khata',value:'Stock Value',statement:'Supplier PDF Statement'})[page],`<div class="row">${btns}</div><label>Select Supplier</label><select id="sFilter" onchange="supplierFilter=this.value;render()"><option value="">${page==='value'?'All suppliers':'Choose supplier'}</option>${db.suppliers.map(s=>`<option value="${s.id}" ${supplierFilter===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`+(!supplierFilter?(page==='value'?`<div class="grid">${metric('Total Stock Cost',money(stockValue()),'green')}${metric('Total Udhaar',money(totalPayable()),'red')}</div>`:db.suppliers.length?'<p class="muted">Supplier select karein.</p>':'<p class="muted">First add a supplier.</p>'):detail()))}
if(page==='backup')h=title('Backup & Data Safety',`<div class="help">Data is stored on this device only. Deleting the Home Screen app or clearing website data may erase records. Save JSON copies regularly to iCloud Drive or Files.</div><p></p><div class="row">${btn('Export JSON Backup','backup()')}${btn('Import Master 27 Backup',"$('#importFile').click()",'secondary')}</div><input id="importFile" type="file" accept=".json,application/json" onchange="restore(this)" /><p class="muted">Master 26 and Master 27 data are kept separately. Older data is NOT automatically imported. Import here supports only Master 27 backups.</p>`);
$('#root').innerHTML=h;$('#nav').innerHTML=[['home','⌂ Home'],['stock','📦 Stock'],['expiry','⏰ Expiry'],['backup','⚙ Backup']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;render();scrollTo(0,0)}function stockRows(sid=''){let ps=db.products.filter(p=>!sid||p.supplierId===sid);return ps.map(p=>`<div class="entry"><b>${esc(p.name)} <span class="stamp">${esc(p.batch||'No batch')}</span></b><small>${esc(supplier(p.supplierId)?.name||'Unknown supplier')} · Remaining ${p.qty} ${esc(p.unit)} · Cost ${money(p.cost)}/${esc(p.unit)} · Value ${money(p.qty*p.cost)}</small><small>Expiry: ${esc(p.expiry||'Not entered')} ${dateDiff(p.expiry)<0?' 🔴 Expired':dateDiff(p.expiry)<=90?' 🟠 Expiring':''}</small></div>`).join('')||'<p class="muted">No stock recorded yet.</p>'}
function detail(){const sid=supplierFilter,s=supplier(sid);if(!s)return '<p>No supplier found.</p>';let h=`<h3>${esc(s.name)}</h3><div class="grid">${metric('Remaining Stock Value',money(stockValue(sid)),'green')}${metric('Actual Supplier Udhaar',money(payable(sid)),'red')}</div><p class="muted">Stock Out reduces stock value; it does NOT reduce payable. Only supplier payments / approved returns reduce payable.</p>`;if(page==='suppliers')h+=`<div class="row">${btn('Add Multiple Products','openPurchase()')}${btn('Stock Out','openOut()','secondary')}</div>`+stockRows(sid);if(page==='value')h+=stockRows(sid);if(page==='khata')h+=ledger(sid);if(page==='statement')h+=`<p class="muted">This supplier's Urdu statement includes transactions, running balance and stock value.</p>${btn('Print / Save PDF / Share','makeStatement()')}`;return h}
function events(sid){let a=[];db.purchases.filter(x=>x.supplierId===sid).forEach(x=>a.push({date:x.date,id:x.id,desc:'Purchase: '+x.items.map(i=>i.name+' × '+i.qty).join(', '),debit:x.total,credit:0}));db.payments.filter(x=>x.supplierId===sid).forEach(x=>a.push({date:x.date,id:x.id,desc:'Supplier Payment',debit:0,credit:x.amount}));db.adjustments.filter(x=>x.supplierId===sid).forEach(x=>a.push({date:x.date,id:x.id,desc:'Supplier Return Credit: '+x.note,debit:0,credit:x.amount}));return a.sort((x,y)=>x.date.localeCompare(y.date)||x.id.localeCompare(y.id))}function ledger(sid){let bal=0;return events(sid).map(e=>{bal+=e.debit-e.credit;return `<div class="entry"><b>${esc(e.desc)}</b><small>${esc(e.date.slice(0,10))} · +${money(e.debit)} / −${money(e.credit)} · Balance ${money(bal)}</small></div>`}).join('')||'<p class="muted">No entries yet.</p>'}
function modal(title,html,fn){$('#dlgTitle').textContent=title;$('#fields').innerHTML=html;$('#frm').onsubmit=e=>{e.preventDefault();try{fn(new FormData(e.target));save();$('#dlg').close();render()}catch(err){alert(err.message)}};$('#dlg').showModal()}function field(name,label,type='text',required=true,extra=''){return `<label>${label}<input type="${type}" name="${name}" ${required?'required':''} ${extra}></label>`}function choose(name,label,items){return `<label>${label}<select required name="${name}">${items.map(i=>`<option value="${esc(i[0])}">${esc(i[1])}</option>`).join('')}</select></label>`}function supplierOptions(){return db.suppliers.map(x=>[x.id,x.name])}
function openSupplier(){modal('Add Supplier',field('name','Supplier Name'),f=>{let name=f.get('name').trim();if(!name)throw Error('Enter supplier name');db.suppliers.push({id:id(),name})})}
let purchaseCount=0;function purchaseRow(){let el=document.createElement('div');el.className='product-line';el.innerHTML=`<button type="button" class="remove warn" onclick="this.parentElement.remove()">×</button>${field('item_name','Product name')}${field('item_unit','Unit (Bottle / Piece / Packet)')}${field('item_qty','Quantity','number',true,'min="1" step="1"')}${field('item_cost','Purchase rate (Rs)','number',true,'min="0" step="any"')}${field('item_expiry','Expiry date','date',false)}${field('item_batch','Batch number', 'text',false)}`;$('#purchaseItems').append(el)}function openPurchase(){if(!db.suppliers.length)return alert('Add supplier first');modal('Multi-Product Stock In',choose('sid','Supplier',supplierOptions())+`<p class="muted">One credit purchase. Add all products below.</p><div id="purchaseItems"></div><button type="button" class="secondary" onclick="purchaseRow()">+ Add Another Product</button>`,f=>{let sid=f.get('sid'),rows=Array.from($('#purchaseItems').children),items=[];if(!rows.length)throw Error('Add at least one product');for(let row of rows){let g=n=>row.querySelector(`[name=${n}]`).value,qty=+g('item_qty'),cost=+g('item_cost');if(!g('item_name').trim()||!Number.isSafeInteger(qty)||qty<1||!Number.isFinite(cost)||cost<0||!g('item_unit').trim())throw Error('Check product details');let item={id:id(),name:g('item_name').trim(),unit:g('item_unit').trim(),qty,cost,expiry:g('item_expiry'),batch:g('item_batch'),supplierId:sid};db.products.push({...item,initialQty:qty});items.push({productId:item.id,name:item.name,qty,cost,unit:item.unit,expiry:item.expiry,batch:item.batch})}db.purchases.push({id:id(),supplierId:sid,date:stamp(),items,total:items.reduce((v,x)=>v+x.qty*x.cost,0),mode:'credit'})});$('#purchaseItems').innerHTML='';purchaseRow()}
function outOptions(){return db.products.filter(p=>p.qty>0).map(p=>[p.id,`${p.name} / ${supplier(p.supplierId)?.name||''} / ${p.qty} ${p.unit}`])}function openOut(){if(!outOptions().length)return alert('No available stock');modal('Stock Out — No Selling',choose('pid','Product / Batch',outOptions())+field('qty','Quantity Out','number',true,'min="1" step="1"')+choose('reason','Reason',[['Sold','Sold'],['Damaged','Damaged'],['Expired','Expired'],['Supplier Return','Supplier Return'],['Other','Other']])+field('note','Optional note','text',false),f=>{let p=product(f.get('pid')),q=+f.get('qty'),reason=f.get('reason');if(!p||!Number.isSafeInteger(q)||q<1||q>p.qty)throw Error('Insufficient stock or invalid quantity');p.qty-=q;db.movements.push({id:id(),date:stamp(),productId:p.id,supplierId:p.supplierId,name:p.name,qty:q,rate:p.cost,reason,note:f.get('note')||''});if(reason==='Supplier Return')alert('Stock returned. Supplier payable has NOT been reduced. Record a separate approved Return Credit after supplier confirms the credit note.')})}
function openPayment(){if(!db.suppliers.length)return alert('Add supplier first');modal('Supplier Payment',choose('sid','Supplier',supplierOptions())+field('amount','Amount Paid (Rs)','number',true,'min="0.01" step="any"'),f=>{let sid=f.get('sid'),amount=+f.get('amount');if(!Number.isFinite(amount)||amount<=0||amount>payable(sid)+0.001)throw Error('Invalid amount or exceeds supplier payable');db.payments.push({id:id(),supplierId:sid,amount,date:stamp()})})}
function openCredit(){if(!db.suppliers.length)return alert('Add supplier first');modal('Approved Supplier Return Credit',`<p class="help">Only use when supplier accepts the return and confirms the credit adjustment. Stock Out must be recorded separately.</p>`+choose('sid','Supplier',supplierOptions())+field('amount','Approved credit amount (Rs)','number',true,'min="0.01" step="any"')+field('note','Returned product / credit note reference'),f=>{let sid=f.get('sid'),amount=+f.get('amount');if(!Number.isFinite(amount)||amount<=0||amount>payable(sid)+0.001)throw Error('Invalid credit amount');db.adjustments.push({id:id(),supplierId:sid,amount,note:f.get('note'),date:stamp()})})}
function makeStatement(){let sid=supplierFilter,s=supplier(sid);if(!s)return alert('Please select a supplier');let balance=0,rows=events(sid).map((e,i)=>{balance+=e.debit-e.credit;return `<tr><td>${i+1}</td><td><span class="ltr">${esc(e.date.slice(0,10))}</span></td><td>${esc(e.desc)}</td><td><span class="ltr">${money(e.debit)}</span></td><td><span class="ltr">${money(e.credit)}</span></td><td><span class="ltr">${money(balance)}</span></td></tr>`}).join('');$('#printArea').innerHTML=`<div class="printpage"><h1>فضل ربی ٹریڈرز</h1><h2>سپلائر کا کھاتہ / جنرل لیجر</h2><p>سپلائر: ${esc(s.name)} <span style="float:left">تاریخ: <span class="ltr">${today()}</span></span></p><div class="summary"><div>کل خریداری<br><b class="ltr">${money(db.purchases.filter(x=>x.supplierId===sid).reduce((t,x)=>t+x.total,0))}</b></div><div>کل ادائیگی و واپسی<br><b class="ltr">${money(db.payments.filter(x=>x.supplierId===sid).reduce((t,x)=>t+x.amount,0)+db.adjustments.filter(x=>x.supplierId===sid).reduce((t,x)=>t+x.amount,0))}</b></div><div>باقی ادھار<br><b class="ltr">${money(payable(sid))}</b></div><div>باقی اسٹاک مالیت<br><b class="ltr">${money(stockValue(sid))}</b></div></div><table><thead><tr><th>نمبر</th><th>تاریخ</th><th>تفصیل</th><th>خریداری</th><th>ادائیگی / واپسی</th><th>باقی</th></tr></thead><tbody>${rows||'<tr><td colspan="6">کوئی ریکارڈ نہیں</td></tr>'}</tbody></table><h3>باقی اسٹاک کی تفصیل</h3><table><thead><tr><th>پروڈکٹ</th><th>باقی تعداد</th><th>خرید ریٹ</th><th>باقی مالیت</th></tr></thead><tbody>${db.products.filter(p=>p.supplierId===sid&&p.qty>0).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty} ${esc(p.unit)}</td><td class="ltr">${money(p.cost)}</td><td class="ltr">${money(p.qty*p.cost)}</td></tr>`).join('')}</tbody></table><p>نوٹ: باقی اسٹاک مالیت اور سپلائر کا ادھار دو الگ حساب ہیں۔</p></div>`;window.print()}
function backup(){let blob=new Blob([JSON.stringify({app:'fazal-master27',version:1,data:db,exportedAt:stamp()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Fazal-Master27-Backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function restore(el){let file=el.files?.[0];if(!file)return;try{let d=JSON.parse(await file.text());if(d.app!=='fazal-master27'||!d.data||Object.keys(empty()).some(k=>!Array.isArray(d.data[k])))throw Error('Not a valid Master 27 backup');if(!confirm('This replaces all CURRENT Master 27 records. Continue?'))return;db=d.data;save();render();alert('Backup restored')}catch(e){alert('Could not import: '+e.message)}finally{el.value=''}}
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
</script></body></html>
