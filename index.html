<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fazal Traders"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Fazal e Rabbi Tradders</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17362a;background:#f3f8f4}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{position:sticky;top:0;background:#176b3b;color:white;padding:17px 16px;z-index:10;box-shadow:0 2px 12px #0002}header strong{font-size:19px}header small{display:block;opacity:.85}main{max-width:780px;margin:auto;padding:14px}.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #1232}.panel h2{margin:0 0 12px;font-size:19px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:white;padding:15px;border-radius:14px;box-shadow:0 2px 10px #1231}.tile b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}.tile span{font-size:12px;color:#52665b}button{border:0;border-radius:11px;padding:12px 16px;font-weight:650;background:#176b3b;color:white;cursor:pointer}button.secondary{background:#e1efe6;color:#165631}button.danger{background:#fee5e5;color:#8c2020}button:disabled{opacity:.45}input,select,textarea{display:block;width:100%;font:inherit;border:1px solid #cddbd1;border-radius:10px;padding:11px;margin:5px 0 12px;background:#fff}label{font-weight:600;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.item{border-top:1px solid #e5ede7;padding:11px 0}.item:first-child{border-top:0}.item strong{display:block}.item small{display:block;color:#66776d;margin-top:4px}.item .right{float:right;font-weight:700}.muted{color:#627367;font-size:13px}.warning{color:#ae5c12}.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #dce8df;padding-bottom:env(safe-area-inset-bottom);z-index:20}.tabs button{font-size:11px;padding:12px 1px;background:white;color:#597366;border-radius:0}.tabs button.active{color:#176b3b;background:#e5f4eb}.hidden{display:none!important}dialog{border:0;border-radius:17px;width:min(96vw,520px);max-height:87vh;overflow:auto;padding:19px;box-shadow:0 12px 60px #0005}dialog::backdrop{background:#0008}dialog h2{margin-top:0}dialog .footer{display:flex;gap:8px;justify-content:flex-end}p{line-height:1.5} .note{font-size:12px;color:#64786c} .bad{color:#aa3030} .tiny{font-size:11px}
.red{color:#bd202e!important}.blue{color:#1559b8!important}.green{color:#178342!important}.tile.clickable{cursor:pointer;border:1px solid #cbded1}.tile.clickable:active{background:#ecf5ed}.danger-row{background:#fff1f2;padding:8px;border-radius:10px}.cashbox{border-left:5px solid #176b3b}.notice{background:#fff5e6;padding:10px;border-radius:10px;color:#80510e;margin:8px 0}.item button{padding:5px 8px;font-size:12px;margin:5px 0} </style></head><body><header><strong>🌿 Fazal e Rabbi Tradders</strong><small>Offline shop management • آف لائن دکان ریکارڈ</small></header><main id="root"></main><nav class="tabs" id="tabs"></nav><dialog id="modal"><h2 id="modalTitle"></h2><form id="modalForm"><div id="modalFields"></div><div class="footer"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button type="submit">Save</button></div></form></dialog><script>
'use strict';const KEY='fazal-rabbi-offline-v1';let data;function base(){return {products:[],customers:[],suppliers:[],sales:[],purchases:[],payments:[],expenses:[],saleReturns:[],purchaseReturns:[]}}try{data=JSON.parse(localStorage.getItem(KEY))||base()}catch{data=base()}for(const k of Object.keys(base()))if(!Array.isArray(data[k]))data[k]=[];let page='home';const $=s=>document.querySelector(s);const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const now=()=>new Date().toISOString();if(!Array.isArray(data.corrections))data.corrections=[];function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Storage unavailable/full. Export a backup immediately. '+e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formFields(fields){return fields.map(f=>`<label>${esc(f.label)}<${f.tag||'input'} name="${esc(f.name)}" ${f.tag==='select'?'':`type="${f.type||'text'}"`} ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} ${f.tag==='select'?'':`placeholder="${esc(f.placeholder||'')}"`} >${f.tag==='select'?(f.options||[]).map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')+'</select>':''}</label>`).join('')}
function modalForm(title,fields,onSave){$('#modalTitle').textContent=title;$('#modalFields').innerHTML=formFields(fields);$('#modalForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget));try{onSave(v);persist();modal.close();render()}catch(err){alert(err.message)}};$('#modal').showModal()}
function addProduct(){modalForm('Add product / batch',[{name:'name',label:'Product name',required:true},{name:'company',label:'Company'},{name:'pack',label:'Packing (e.g. 500ml)'},{name:'unit',label:'Unit / Nature',tag:'select',options:['Bottle','ml','Packet','Piece','kg','Gallon','Bag','Drum'].map(x=>[x,x])},{name:'batch',label:'Batch number'},{name:'expiry',label:'Expiry date',type:'date'},{name:'quantity',label:'Opening quantity',type:'number',min:0,step:'1',required:true},{name:'buy',label:'Purchase price (Rs)',type:'number',min:0,step:'any',required:true},{name:'sell',label:'Sale price (Rs)',type:'number',min:0,step:'any',required:true}],v=>{data.products.push({...v,id:id(),quantity:+v.quantity,buy:+v.buy,sell:+v.sell});});}
function addPerson(type){modalForm(type==='customers'?'Add customer':'Add supplier',[{name:'name',label:'Name',required:true},{name:'phone',label:'Phone'},{name:'detail',label:type==='customers'?'Village / address':'Company / address'}],v=>data[type].push({...v,id:id()}))}
function saleModeChanged(){const mode=$('#modalFields [name=mode]')?.value;const c=$('#modalFields [name=customer]');if(c){c.parentElement.style.display=mode==='credit'?'block':'none';c.required=mode==='credit'}}
function purchaseModeChanged(){const mode=$('#modalFields [name=mode]')?.value;const paid=$('#modalFields [name=paid]');if(paid){paid.parentElement.style.display=mode==='credit'?'block':'none'}}
function addSale(){if(!data.products.length)return alert('Please add stock first');modalForm('New Sale / نئی فروخت',[{name:'mode',label:'Sale Type / فروخت کی قسم',tag:'select',options:[['cash','Cash Sale / نقد'],['credit','Credit Sale / ادھار']]},{name:'product',label:'Product / batch',tag:'select',options:data.products.map(x=>[x.id,`${x.name} (${x.quantity} ${x.unit||'units'} available)`])},{name:'customer',label:'Customer for credit sale (add customer with phone in Khata)',tag:'select',options:[['','Choose customer'],...data.customers.map(x=>[x.id,`${x.name} - ${x.phone||'no phone'}`])]},{name:'quantity',label:'Quantity / تعداد',type:'number',min:1,step:'1',required:true},{name:'price',label:'Rate per unit / فی یونٹ قیمت',type:'number',min:0,step:'any',required:true}],v=>{const p=data.products.find(x=>x.id===v.product),q=+v.quantity,price=+v.price;if(!p||!Number.isInteger(q)||q<1||q>p.quantity)throw Error('Invalid quantity or insufficient stock');if(!Number.isFinite(price)||price<0)throw Error('Invalid price');if(v.mode==='credit'&&!v.customer)throw Error('Select a customer for credit sale');if(v.mode==='credit'&&!data.customers.find(x=>x.id===v.customer)?.phone?.trim())throw Error('Please add customer phone in Khata first');const received=v.mode==='cash'?q*price:0;if(p.expiry&&p.expiry<dateStr(new Date()))throw Error('Expired product cannot be sold');p.quantity-=q;data.sales.push({id:id(),product:p.id,name:p.name,customer:v.mode==='credit'?v.customer:'',quantity:q,price,received,cost:p.buy,mode:v.mode,unit:p.unit||'Unit',date:now()})});const m=$('#modalFields [name=mode]');m.onchange=saleModeChanged;saleModeChanged();}
function addPurchase(){if(!data.products.length||!data.suppliers.length)return alert('Add a product and supplier first');modalForm('New Purchase / خریداری',[{name:'mode',label:'Purchase Type / خریداری کی قسم',tag:'select',options:[['cash','Cash Purchase / نقد'],['credit','Credit Purchase / ادھار']]},{name:'product',label:'Product / batch',tag:'select',options:data.products.map(x=>[x.id,x.name+' / '+(x.batch||'-')])},{name:'supplier',label:'Supplier',tag:'select',options:data.suppliers.map(x=>[x.id,x.name])},{name:'quantity',label:'Quantity added',type:'number',min:1,step:'1',required:true},{name:'cost',label:'Cost per unit',type:'number',min:0,step:'any',required:true},{name:'paid',label:'Advance paid (credit purchase)',type:'number',min:0,step:'any',placeholder:'0'}],v=>{let p=data.products.find(x=>x.id===v.product),q=+v.quantity,c=+v.cost,total=q*c,paid=v.mode==='cash'?total:Number(v.paid||0);if(!p||!Number.isInteger(q)||q<1||!Number.isFinite(c)||c<0||!Number.isFinite(paid)||paid<0||paid>total)throw Error('Invalid purchase amounts');p.quantity+=q;p.buy=c;data.purchases.push({id:id(),product:v.product,supplier:v.supplier,quantity:q,cost:c,paid,mode:v.mode,date:now()})});$('#modalFields [name=mode]').onchange=purchaseModeChanged;purchaseModeChanged();}
function addPayment(type){const arr=data[type==='customer'?'customers':'suppliers'];if(!arr.length)return alert('First add an account');modalForm(type==='customer'?'Receive customer payment':'Pay supplier',[{name:'party',label:'Name',tag:'select',options:arr.map(x=>[x.id,x.name])},{name:'amount',label:'Amount (Rs)',type:'number',min:0.01,step:'any',required:true}],v=>{if(!(+v.amount>0))throw Error('Enter a positive amount');if(+v.amount>balance(type,v.party))throw Error('Payment exceeds remaining balance');data.payments.push({id:id(),type,party:v.party,amount:+v.amount,date:now()})})}
function addExpense(){modalForm('Daily expense',[{name:'amount',label:'Amount (Rs)',type:'number',min:0.01,step:'any',required:true},{name:'note',label:'Details'}],v=>{if(!(+v.amount>0))throw Error('Invalid amount');data.expenses.push({...v,id:id(),amount:+v.amount,date:now()})})}
function balance(type,party){const billed=type==='customer'?data.sales.filter(x=>x.customer===party).reduce((s,x)=>s+x.quantity*x.price-x.received,0):data.purchases.filter(x=>x.supplier===party).reduce((s,x)=>s+x.quantity*x.cost-x.paid,0);const paid=data.payments.filter(x=>x.type===type&&x.party===party).reduce((s,x)=>s+x.amount,0);const returns=type==='customer'?data.saleReturns.filter(x=>x.customer===party).reduce((s,x)=>s+x.total-x.refund,0):data.purchaseReturns.filter(x=>x.supplier===party).reduce((s,x)=>s+x.total-x.refund,0);return Math.max(0,Math.round((billed-paid-returns)*100)/100)}
function cashTotal(end){const before=x=>!end||x.date<end;const saleCash=data.sales.filter(before).reduce((sum,x)=>sum+Number(x.received||0),0);const receiptCash=data.payments.filter(x=>before(x)&&x.type==='customer').reduce((sum,x)=>sum+Number(x.amount||0),0);const buying=data.purchases.filter(before).reduce((sum,x)=>sum+Number(x.paid||0),0);const supplierCash=data.payments.filter(x=>before(x)&&x.type==='supplier').reduce((sum,x)=>sum+Number(x.amount||0),0);const expenses=data.expenses.filter(before).reduce((sum,x)=>sum+Number(x.amount||0),0);const saleRefund=data.saleReturns.filter(before).reduce((s,x)=>s+Number(x.refund||0),0);const purchaseRefund=data.purchaseReturns.filter(before).reduce((s,x)=>s+Number(x.refund||0),0);return Number(data.openingCash||0)+saleCash+receiptCash-buying-supplierCash-expenses-saleRefund+purchaseRefund}
function setOpeningCash(){if(data.cashOpeningSet&&!confirm('Change opening cash? This will recalculate cash balance.'))return;const val=prompt('Opening cash / شروع کا گلہ (Rs)',String(data.openingCash||0));if(val===null)return;const n=Number(val);if(!Number.isFinite(n)||n<0)return alert('Enter valid non-negative amount');data.openingCash=n;data.cashOpeningSet=true;persist();render()}
function showAccounts(type){page='khata';render();setTimeout(()=>document.getElementById(type==='customer'?'customerAccounts':'supplierAccounts')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function cashDetail(){const date=dateStr(new Date()),start=date+'T',end=new Date(new Date(date+'T00:00:00').getTime()+86400000).toISOString();const entries=[...data.sales.map(x=>({date:x.date,label:'Cash sale: '+x.name,amount:Number(x.received||0)})),...data.payments.map(x=>({date:x.date,label:x.type==='customer'?'Customer payment':'Supplier payment',amount:(x.type==='customer'?1:-1)*Number(x.amount||0)})),...data.purchases.map(x=>({date:x.date,label:'Purchase',amount:-Number(x.paid||0)})),...data.saleReturns.map(x=>({date:x.date,label:'Sales return refund',amount:-Number(x.refund||0)})),...data.purchaseReturns.map(x=>({date:x.date,label:'Purchase return refund',amount:Number(x.refund||0)})),...data.expenses.map(x=>({date:x.date,label:'Expense: '+(x.note||''),amount:-Number(x.amount||0)}))].filter(x=>x.date>=start&&x.amount!==0).sort((a,b)=>a.date.localeCompare(b.date));const opening=cashTotal(start);$('#root').innerHTML=section('Daily Galla / آج کا گلہ',`<button class="secondary" onclick="render()">← Back</button><p><b>Opening cash: ${money(opening)}</b></p>`+entries.map(x=>line(x.label,new Date(x.date).toLocaleString(),(x.amount<0?'- ':'+ ')+money(Math.abs(x.amount)))).join('')+`<h2>Closing cash: ${money(cashTotal())}</h2><p class="note">Credit sales and unpaid purchases do not change cash until money moves.</p>`)}
function line(title,subtitle,right){return `<div class="item"><span class="right">${esc(right)}</span><strong>${esc(title)}</strong><small>${esc(subtitle)}</small></div>`}function totals(start){const sales=data.sales.filter(x=>x.date>=start),expenses=data.expenses.filter(x=>x.date>=start),purchases=data.purchases.filter(x=>x.date>=start);const returned=data.saleReturns.filter(x=>x.date>=start),revenue=sales.reduce((s,x)=>s+x.quantity*x.price,0)-returned.reduce((s,x)=>s+x.total,0),gross=sales.reduce((s,x)=>s+x.quantity*(x.price-x.cost),0)-returned.reduce((s,x)=>s+x.profitReversal,0),cost=expenses.reduce((s,x)=>s+x.amount,0);return {revenue,gross,expenses:cost,net:gross-cost,purchases:purchases.reduce((s,x)=>s+x.quantity*x.cost,0)-data.purchaseReturns.filter(x=>x.date>=start).reduce((s,x)=>s+x.total,0)}}function tile(label,value,color='',action=''){return `<div class="tile ${action?'clickable':''}" ${action?`onclick="${action}" role="button" tabindex="0"`:''}><span>${esc(label)}</span><b class="${color}">${esc(value)}</b></div>`}const section=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;const dateStr=d=>d.toLocaleDateString('en-CA');function render(){const n=new Date(),day=dateStr(n)+'T',month=dateStr(n).slice(0,7),td=totals(day),tm=totals(month);const nav=[['home','🏠','Home'],['stock','📦','Stock'],['sales','🛒','Sales'],['khata','📒','Khata'],['reports','📊','Reports']];$('#tabs').innerHTML=nav.map(([v,i,l])=>`<button class="${v===page?'active':''}" data-page="${v}">${i}<br>${l}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let html='';if(page==='home'){const low=data.products.filter(x=>x.quantity>0&&x.quantity<5),out=data.products.filter(x=>x.quantity<=0),expired=data.products.filter(x=>x.expiry&&x.expiry<=dateStr(n));const rec=data.customers.reduce((s,x)=>s+balance('customer',x.id),0),pay=data.suppliers.reduce((s,x)=>s+balance('supplier',x.id),0);html=`<div class="tiles">${tile('Galla Cash / گلہ',money(cashTotal()),cashTotal()<0?'red':'green','cashDetail()')}${tile('Net Profit / منافع',money(td.net),'green')}${tile('Account Receivable / وصولی',money(rec),'red',"showAccounts('customer')")}${tile('Account Payable / ادائیگی',money(pay),'blue',"showAccounts('supplier')")}${tile('Low Stock / کم اسٹاک',low.length,'red')}${tile('Out of Stock / ختم اسٹاک',out.length,'red')}</div><br>`+section('Cash Book / گلہ حساب',`<div class="actions"><button onclick="cashDetail()">View Daily Galla</button><button class="secondary" onclick="setOpeningCash()">Set Opening Cash</button></div><p class="note">Cash balance counts cash sales, received payments, cash purchases, supplier payments and expenses. Credit amounts do not change cash.</p>`)+section('Stock alerts',`<p class="red"><b>Low stock under 5: ${low.length} • Out of stock: ${out.length}</b></p><p class="warning">Expired: ${expired.length} batches</p>`+[...out,...low].slice(0,12).map(x=>`<div class="danger-row">${line(x.name,x.batch||'-',`${x.quantity} ${x.unit||'units'}`)}</div>`).join(''))+expiryDashboard()+section('Quick actions','<div class="actions"><button onclick="addSale()">New Sale</button><button class="secondary" onclick="addPurchase()">Purchase</button><button class="secondary" onclick="addExpense()">Expense</button></div>')}
if(page==='stock')html=section('Stock / Inventory','<div class="actions"><button onclick="addProduct()">+ Add Product</button><button class="secondary" onclick="addPurchase()">+ Stock Purchase</button><button class="secondary" onclick="addPurchaseReturn()">↩ Purchase Return</button></div>'+(!data.products.length?'<p class="muted">No stock added yet.</p>':data.products.map(x=>line(x.name,`${x.company} • ${x.pack} • Batch ${x.batch||'-'} • Exp ${x.expiry||'-'} • Buy ${money(x.buy)} • Sell ${money(x.sell)}`,`${x.quantity} ${x.unit||'units'}`)+`<div class="${expiryInfo(x).cls}">${expiryInfo(x).label}</div><button class="secondary" onclick="editProduct('${x.id}')">Edit product</button> <button class="secondary" onclick="stockAdjustment('${x.id}')">Adjust stock</button>`).join('')));
if(page==='sales')html=section('Sales / فروخت',`<div class="actions"><button onclick="addMultiSale()">+ Multi-product Sale</button><button class="secondary" onclick="addSale()">+ Single Sale</button><button class="secondary" onclick="addSaleReturn()">↩ Sale Return</button></div>`+(!data.sales.length?'<p class="muted">No sales yet.</p>':data.sales.slice().reverse().filter((x,i,a)=>!x.invoice||a.findIndex(y=>y.invoice===x.invoice)===i).map(x=>`<div class="item clickable" onclick="showSaleDetail('${x.id}')"><span class="right">${money(saleItems(x).reduce((n,y)=>n+y.quantity*y.price,0))}</span><strong>${esc(x.invoice||x.name)}</strong><small>${esc(x.quantity+' × '+money(x.price))} • ${new Date(x.date).toLocaleString()} • Tap for details</small><button class="secondary" onclick="event.stopPropagation();editSale('${x.id}')">Edit</button> <button class="danger" onclick="event.stopPropagation();voidSale('${x.id}')">Void</button></div>`).join(''))+section('Sales Returns',data.saleReturns.slice().reverse().map(x=>line('Returned: '+x.name,new Date(x.date).toLocaleString(),money(x.total))).join('')||'<p class="muted">No returns</p>'));

if(page==='khata')html=section('<span id="customerAccounts">Customer Khata</span>','<div class="actions"><button onclick="addPerson(\'customers\')">+ Customer</button><button class="secondary" onclick="addPayment(\'customer\')">Receive Payment</button></div>'+data.customers.map(x=>line(x.name,`${x.phone||''} • ${x.detail||''}`,money(balance('customer',x.id)))+`<button class="secondary" onclick="editPerson('customers','${x.id}')">Edit</button>`).join('')+'<p class="note">Balance is outstanding customer credit.</p><button onclick="printCustomerLedger()">📄 Urdu Ledger PDF / WhatsApp</button>'+paymentEditList('customer'))+section('<span id="supplierAccounts">Supplier Khata</span>','<div class="actions"><button onclick="addPerson(\'suppliers\')">+ Supplier</button><button class="secondary" onclick="addPayment(\'supplier\')">Pay Supplier</button><button class="secondary" onclick="addPurchase()">Stock Purchase</button><button class="secondary" onclick="addPurchaseReturn()">Purchase Return</button></div>'+data.suppliers.map(x=>line(x.name,`${x.phone||''} • ${x.detail||''}`,money(balance('supplier',x.id)))+`<button class="secondary" onclick="editPerson('suppliers','${x.id}')">Edit</button>`).join('')+paymentEditList('supplier')+purchaseHistory());
if(page==='reports')html=section('Daily Galla / Cash Book',`<div class="tiles">${tile('Current Cash',money(cashTotal()),cashTotal()<0?'red':'green')}${tile('Cash Opening',money(cashTotal(day)))}</div><div class="actions"><button onclick="cashDetail()">View Cash Entries</button></div>`)+section('Today',`<div class="tiles">${tile('Sales',money(td.revenue))}${tile('Gross profit',money(td.gross))}${tile('Expenses',money(td.expenses))}${tile('Net profit',money(td.net))}</div>`)+section('This month',`<div class="tiles">${tile('Sales',money(tm.revenue))}${tile('Purchases',money(tm.purchases))}${tile('Expenses',money(tm.expenses))}${tile('Net profit',money(tm.net))}</div>`)+section('Balances',`<div class="tiles">${tile('Customer credit',money(data.customers.reduce((s,x)=>s+balance('customer',x.id),0)))}${tile('Supplier payable',money(data.suppliers.reduce((s,x)=>s+balance('supplier',x.id),0)))}${tile('Inventory value',money(data.products.reduce((s,x)=>s+x.quantity*x.buy,0)))}${tile('Total batches',data.products.length)}</div><p class="note">Profit is not the same as cash flow.</p>`)+section('Expenses','<button onclick="addExpense()">+ Add Expense</button>'+data.expenses.slice().reverse().slice(0,15).map(x=>line(x.note||'Expense',new Date(x.date).toLocaleString(),money(x.amount))+`<button class="secondary" onclick="editExpense('${x.id}')">Edit expense</button>`).join(''))+section('Correction History',`<p class="note">Last 30 edits • محفوظ تبدیلیوں کی تاریخ</p>`+data.corrections.slice(-30).reverse().map(correctionRow).join('') )+section('Urdu Ledger / جنرل لیجر','<button onclick="printCustomerLedger()">Customer Ledger PDF / WhatsApp</button>')+section('Reset App / نیا ریکارڈ','<p class="bad">Backup banaye bina reset na karein. Reset irreversible hai.</p><button class="danger" onclick="resetShop()">Reset All Shop Data</button>')+section('Data & backup',`<p class="bad"><b>Important:</b> Offline data stays in this browser on this device and may be lost if Safari website data is cleared or the app is removed. Export backups frequently.</p><div class="actions"><button onclick="exportData()">Export JSON Backup</button><button class="secondary" onclick="$('#restore').click()">Restore Backup</button></div><input id="restore" type="file" accept="application/json,.json" hidden onchange="restoreData(this)"><p class="note">Exported backups are not encrypted. Keep them private. This first version has no login/PIN and no cloud synchronization.</p>`);
$('#root').innerHTML=html}

urn alert('Check stock, quantity and price');lines.push({product:p.id,name:p.name,unit:p.unit,q,price,cost:p.buy});draw()};draw();$('#modalForm').onsubmit=e=>{e.preventDefault();if(!lines.length)return alert('Add at least one item');const mode=$('#multiMode').value,customer=$('#multiCustomer').value;if(mode==='credit'&&(!customer||!data.customers.find(x=>x.id===customer)?.phone))return alert('Select a customer with phone number');for(const x of lines){const p=data.products.find(p=>p.id===x.product);if(!p||p.quantity<x.q)return alert('Not enough stock for '+x.name);if(p.expiry&&p.expiry<dateStr(new Date()))return alert('Expired product: '+x.name)}const invoice='INV-'+Date.now(),date=now();for(const x of lines){const p=data.products.find(p=>p.id===x.product);if(p.expiry&&p.expiry<dateStr(new Date()))return alert('Expired product cannot be sold: '+p.name);p.quantity-=x.q;data.sales.push({id:id(),invoice,product:p.id,name:p.name,customer:mode==='credit'?customer:'',quantity:x.q,price:x.price,received:mode==='cash'?x.q*x.price:0,cost:x.cost,mode,unit:x.unit,date})}persist();modal.close();render()};$('#modal').showModal()}

/* PHASE 3A: safely editable master data, expense and payment corrections with audit history.
   Sales/purchases already involving returns are not modified silently. */
function correctionRow(entry){
 let detail=entry.detail, before={}, after={};
 try{const parsed=typeof detail==='string'?JSON.parse(detail):detail;if(parsed&&typeof parsed==='object'){before=parsed.before||{};after=parsed.after||{}}}catch(_){return line(entry.label||'Correction',new Date(entry.date).toLocaleString(),String(detail||''))}
 const label=entry.label||'Correction';
 const customer=after.name||before.name||'';
 const changed=Object.keys(after).filter(k=>!['id','date','createdAt','updatedAt'].includes(k)&&JSON.stringify(before[k])!==JSON.stringify(after[k]));
 const keyNames={amount:'Payment / Amount',price:'Sale price',buy:'Purchase price',quantity:'Quantity',name:'Name',phone:'Phone',note:'Description',company:'Company',unit:'Unit',pack:'Packing',expiry:'Expiry',low:'Low stock'};
 const fmt=(key,val)=>val===undefined||val===null?'—':(['amount','price','buy'].includes(key)&&Number.isFinite(Number(val))?money(Number(val)):String(val));
 const title=label+(customer?' — '+customer:'');
 if(!changed.length)return line(title,new Date(entry.date).toLocaleString(),'No displayed fields changed');
 const lines=changed.map(k=>`${keyNames[k]||k}: ${fmt(k,before[k])} → ${fmt(k,after[k])}`);
 if(changed.includes('amount')&&Number.isFinite(Number(before.amount))&&Number.isFinite(Number(after.amount)))lines.push('Difference: '+(Number(after.amount)-Number(before.amount)>=0?'+':'−')+money(Math.abs(Number(after.amount)-Number(before.amount))));
 return `<div class="item"><strong>${esc(title)}</strong><small>${esc(new Date(entry.date).toLocaleString())}</small><div style="margin-top:8px;white-space:pre-line;font-size:14px;line-height:1.6;overflow-wrap:anywhere">${esc(lines.join('\n'))}</div></div>`;
}
function snapshotChange(label,before,after){
 if(!Array.isArray(data.corrections))data.corrections=[];
 data.corrections.push({id:id(),date:now(),label,detail:JSON.stringify({before,after})});
}

function editPayment(paymentId){const row=data.payments.find(x=>x.id===paymentId);if(!row)return;

function refReturns(kind,itemId){return data[kind].filter(x=>x[kind==='saleReturns'?'saleId':'purchaseId']===itemId)}
function stockAdjustment(pid){const p=data.products.find(x=>x.id===pid);if(!p)return;modalForm('Stock correction / اسٹاک درستگی',[{name:'quantity',label:'Actual stock quantity',type:'number',min:0,step:'1',required:true},{name:'reason',label:'Reason for correction',required:true}],v=>{const q=Number(v.quantity);if(!Number.isSafeInteger(q)||q<0||!v.reason.trim())throw Error('Enter valid stock and reason');const before={...p};p.quantity=q;snapshotChange('Stock adjustment: '+p.name,{...before,reason:v.reason},{...p,reason:v.reason});});editDefaults({quantity:p.quantity})}
function oldLineSale(s){return {...s,received:Number(s.received||0),quantity:Number(s.quantity),price:Number(s.price),cost:Number(s.cost||0)}}
function editSale(sid){const s=data.sales.find(x=>x.id===sid);if(!s)return;
 if(s.invoice&&data.sales.filter(x=>x.invoice===s.invoice).length>1)return alert('Multi-product invoice: edit individual items is disabled for safety. Use a return and corrected invoice.');
 if(refReturns('saleReturns',s.id).length)return alert('This sale has returns. Edit is locked to prevent incorrect balances; use return and corrected sale.');
 const p=data.products.find(x=>x.id===s.product);if(!p)return alert('Product missing');
 modalForm('Edit sale / فروخت درست کریں',[{name:'quantity',label:'Quantity',type:'number',min:1,step:'1',required:true},{name:'price',label:'Rate per unit',type:'number',min:0,step:'any',required:true},{name:'reason',label:'Reason for correction',required:true}],v=>{
 const q=Number(v.quantity),price=Number(v.price);if(!Number.isSafeInteger(q)||q<1||q>p.quantity+s.quantity||!Number.isFinite(price)||price<0||!v.reason.trim())throw Error('Invalid quantity, price or stock');
 const before={...s};const total=q*price;
 if((s.mode||'cash')==='cash'){s.received=total}else{if(Number(s.received||0)>total)throw Error('Received amount is above corrected invoice total')}
 if(s.customer&&q*price-s.received < (s.quantity*s.price-s.received)-balance('customer',s.customer)-0.001)throw Error('Customer payments already exceed revised sale. Use returns.');p.quantity+=s.quantity-q;s.quantity=q;s.price=price;snapshotChange('Sale correction: '+s.name,{...before,reason:v.reason},{...s,reason:v.reason});});editDefaults({quantity:s.quantity,price:s.price});}
function editPurchase(pid){const pch=data.purchases.find(x=>x.id===pid);if(!pch)return;
 if(refReturns('purchaseReturns',pch.id).length)return alert('Purchase has returns; use a balancing transaction instead of editing it.');
 const p=data.products.find(x=>x.id===pch.product);if(!p)return alert('Product missing');
 modalForm('Edit purchase / خریداری درست کریں',[{name:'quantity',label:'Purchased quantity',type:'number',min:1,step:'1',required:true},{name:'cost',label:'Unit buying rate',type:'number',min:0,step:'any',required:true},{name:'reason',label:'Reason for correction',required:true}],v=>{
 const q=Number(v.quantity),cost=Number(v.cost);if(!Number.isSafeInteger(q)||q<1||p.quantity+q-pch.quantity<0||!Number.isFinite(cost)||cost<0||!v.reason.trim())throw Error('Invalid quantity/cost or stock already sold');
 const total=q*cost;if((pch.mode||'cash')==='cash'){const oldTotal=pch.quantity*pch.cost;if(Math.abs(Number(pch.paid||0)-oldTotal)<.01)pch.paid=total;else if(Number(pch.paid||0)>total)throw Error('Recorded paid amount exceeds new total');}else if(Number(pch.paid||0)>total)throw Error('Existing advance exceeds new total');
 if(pch.supplier&&total-pch.paid < (pch.quantity*pch.cost-pch.paid)-balance('supplier',pch.supplier)-0.001)throw Error('Supplier payments exceed revised purchase. Use a return.');const before={...pch};p.quantity+=q-pch.quantity;pch.quantity=q;pch.cost=cost;p.buy=cost;snapshotChange('Purchase correction',{...before,reason:v.reason},{...pch,reason:v.reason});});editDefaults({quantity:pch.quantity,cost:pch.cost});}
function voidSale(sid){const s=data.sales.find(x=>x.id===sid);if(!s)return;
 if(s.invoice&&data.sales.filter(x=>x.invoice===s.invoice).length>1)return alert('Multi-product invoice: use returns instead of voiding one line');
 if(refReturns('saleReturns',sid).length)return alert('Cannot void a sale with recorded returns');
 if(s.customer&&Number(s.received||0)===0){const debt=balance('customer',s.customer);if(debt+0.001<s.quantity*s.price)return alert('Customer has subsequent payments; void would create incorrect balance. Use a return instead.');}
 if(!confirm('VOID this sale? This will reverse stock, cash and receivable. Continue?'))return;
 const p=data.products.find(x=>x.id===s.product);if(!p)return alert('Product missing');const before={...s};p.quantity+=s.quantity;data.sales=data.sales.filter(x=>x.id!==sid);snapshotChange('Void sale',{...before},{status:'VOID',id:sid});persist();render();}
function voidPurchase(pid){const x=data.purchases.find(x=>x.id===pid);if(!x)return;
 if(refReturns('purchaseReturns',pid).length)return alert('Purchase with returns cannot be voided');

 if(x.supplier&&balance('supplier',x.supplier)+.001<x.quantity*x.cost-Number(x.paid||0))return alert('Supplier payments make void unsafe; use a return instead');
 if(!confirm('VOID purchase and reverse stock, cash and supplier balance?'))return;
 const before={...x};p.quantity-=x.quantity;data.purchases=data.purchases.filter(z=>z.id!==pid);snapshotChange('Void purchase',before,{status:'VOID',id:pid});persist();render();}

function getLedgerRows(customerId,start,end){const rows=[];for(const s of data.sales.filter(s=>s.customer===customerId))rows.push({date:s.date,kind:'sale',desc:s.name+' — '+s.quantity+' '+(s.unit||'')+' × '+money(s.price),debit:s.quantity*s.price,credit:Number(s.received||0),rate:s.price,qty:s.quantity});for(const x of data.payments.filter(x=>x.type==='customer'&&x.party===customerId))rows.push({date:x.date,kind:'payment',desc:'وصول شدہ رقم / Payment received',debit:0,credit:Number(x.amount||0)});for(const x of data.saleReturns.filter(x=>x.customer===customerId))rows.push({date:x.date,kind:'return',desc:'واپسی / Return — '+x.name,debit:Number(x.refund||0),credit:Number(x.total||0)});rows.sort((a,b)=>a.date.localeCompare(b.date));let opening=0;for(const x of rows.filter(x=>x.date.slice(0,10)<start))opening+=x.debit-x.credit;return {opening,rows:rows.filter(x=>x.date.slice(0,10)>=start&&x.date.slice(0,10)<=end)}}
function printCustomerLedger(){if(!data.customers.length)return alert('Add a customer first');const today=dateStr(new Date()),start=today.slice(0,7)+'-01';modalForm('Urdu customer ledger / اردو کھاتہ',[{name:'customer',label:'Customer / گاہک',tag:'select',options:data.customers.map(x=>[x.id,x.name+' — '+(x.phone||'')])},{name:'start',label:'Start date',type:'date',required:true},{name:'end',label:'End date',type:'date',required:true}],v=>{if(v.start>v.end)throw Error('Invalid date range');modal.close();openLedgerPrint(v.customer,v.start,v.end)});editDefaults({start,end:today});}
function openLedgerPrint(cid,start,end){const customer=data.customers.find(x=>x.id===cid);if(!customer)return;const ledger=getLedgerRows(cid,start,end);let current=ledger.opening;let purchases=0,received=0;const rows=ledger.rows.map((x,i)=>{current+=x.debit-x.credit;purchases+=x.kind==='sale'?x.debit:0;received+=x.kind==='payment'?x.credit:0;return `<tr><td>${i+1}</td><td>${esc(x.date.slice(0,10))}</td><td>${esc(x.desc)}</td><td>${x.kind==='sale'?money(x.debit):'—'}</td><td>${x.credit?money(x.credit):'—'}</td><td>${money(current)}</td></tr>`}).join('');const html=`<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اردو جنرل لیجر</title><style>body{font-family:system-ui,'Noto Nastaliq Urdu',sans-serif;padding:22px;color:#17362a}h1{text-align:center;color:#176b3b;margin:0}.info,.summary{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;background:#f0f8f2;padding:15px;margin:16px 0;border-radius:8px}.summary b{display:block;font-size:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #bbb;padding:8px;text-align:right}th{background:#e5f1e9}tr:nth-child(even){background:#fafcfb}.due{color:#b52323}button{padding:12px;background:#176b3b;color:white;border:0;border-radius:9px}@media print{button,p.tip{display:none}body{padding:0}@page{size:A4;margin:12mm}}</style></head><body><h1>فضلِ ربی ٹریڈرز</h1><h2 style="text-align:center">گاہک کا ماہانہ حساب / جنرل لیجر</h2><div class="info"><span><b>گاہک:</b> ${esc(customer.name)}</span><span><b>فون:</b> ${esc(customer.phone||'-')}</span><span><b>مدت:</b> ${start} تا ${end}</span></div><div class="summary"><span>پچھلا بقایا <b>${money(ledger.opening)}</b></span><span>نئی خریداری <b>${money(purchases)}</b></span><span>وصول شدہ رقم <b>${money(received)}</b></span><span>باقی رقم <b class="due">${money(current)}</b></span></div><table><thead><tr><th>نمبر</th><th>تاریخ</th><th>تفصیل</th><th>خریداری</th><th>جمع رقم</th><th>بقایا</th></tr></thead><tbody>${rows||'<tr><td colspan="6">اس مدت میں کوئی لین دین نہیں</td></tr>'}</tbody></table><p class="tip">iPhone: Share / Print → Save to Files as PDF, then WhatsApp par share karein.</p><button onclick="window.print()">PDF محفوظ کریں / Print</button></body></html>`;const w=window.open('','_blank');if(!w)return alert('Allow pop-ups in Safari to create the ledger');w.document.write(html);w.document.close();}
function resetShop(){const confirmation=prompt('DANGER: This deletes ALL local shop records on this device. Export a backup first. Type RESET to continue:');if(confirmation!=='RESET')return;const second=confirm('FINAL CONFIRMATION: Delete all shop transactions, stock, khata, and opening cash? Cannot undo without valid backup.');if(!second)return;data=base();data.corrections=[];data.openingCash=0;data.cashOpeningSet=false;persist();page='home';render();alert('App reset completed. Restore backup if needed.');}

render();
</script></body></html>
