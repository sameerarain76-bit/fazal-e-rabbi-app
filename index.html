<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b3b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fazal Traders"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Fazal e Rabbi Tradders</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17362a;background:#f3f8f4}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{position:sticky;top:0;background:#176b3b;color:white;padding:17px 16px;z-index:10;box-shadow:0 2px 12px #0002}header strong{font-size:19px}header small{display:block;opacity:.85}main{max-width:780px;margin:auto;padding:14px}.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #1232}.panel h2{margin:0 0 12px;font-size:19px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:white;padding:15px;border-radius:14px;box-shadow:0 2px 10px #1231}.tile b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}.tile span{font-size:12px;color:#52665b}button{border:0;border-radius:11px;padding:12px 16px;font-weight:650;background:#176b3b;color:white;cursor:pointer}button.secondary{background:#e1efe6;color:#165631}button.danger{background:#fee5e5;color:#8c2020}button:disabled{opacity:.45}input,select,textarea{display:block;width:100%;font:inherit;border:1px solid #cddbd1;border-radius:10px;padding:11px;margin:5px 0 12px;background:#fff}label{font-weight:600;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.item{border-top:1px solid #e5ede7;padding:11px 0}.item:first-child{border-top:0}.item strong{display:block}.item small{display:block;color:#66776d;margin-top:4px}.item .right{float:right;font-weight:700}.muted{color:#627367;font-size:13px}.warning{color:#ae5c12}.tabs{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #dce8df;padding-bottom:env(safe-area-inset-bottom);z-index:20}.tabs button{font-size:11px;padding:12px 1px;background:white;color:#597366;border-radius:0}.tabs button.active{color:#176b3b;background:#e5f4eb}.hidden{display:none!important}dialog{border:0;border-radius:17px;width:min(96vw,520px);max-height:87vh;overflow:auto;padding:19px;box-shadow:0 12px 60px #0005}dialog::backdrop{background:#0008}dialog h2{margin-top:0}dialog .footer{display:flex;gap:8px;justify-content:flex-end}p{line-height:1.5} .note{font-size:12px;color:#64786c} .bad{color:#aa3030} .tiny{font-size:11px}
.red{color:#bd202e!important}.blue{color:#1559b8!important}.green{color:#178342!important}.tile.clickable{cursor:pointer;border:1px solid #cbded1}.tile.clickable:active{background:#ecf5ed}.danger-row{background:#fff1f2;padding:8px;border-radius:10px}.cashbox{border-left:5px solid #176b3b}.notice{background:#fff5e6;padding:10px;border-radius:10px;color:#80510e;margin:8px 0}.item button{padding:5px 8px;font-size:12px;margin:5px 0} </style></head><body><header><strong>🌿 Fazal e Rabbi Tradders</strong><small>Offline shop management • آف لائن دکان ریکارڈ</small></header><main id="root"></main><nav class="tabs" id="tabs"></nav><dialog id="modal"><h2 id="modalTitle"></h2><form id="modalForm"><div id="modalFields"></div><div class="footer"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button type="submit">Save</button></div></form></dialog><script>
'use strict';const KEY='fazal-rabbi-offline-v1';let data;function base(){return {products:[],customers:[],suppliers:[],sales:[],purchases:[],payments:[],expenses:[]}}try{data=JSON.parse(localStorage.getItem(KEY))||base()}catch{data=base()}for(const k of Object.keys(base()))if(!Array.isArray(data[k]))data[k]=[];let page='home';const $=s=>document.querySelector(s);const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const now=()=>new Date().toISOString();function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Storage unavailable/full. Export a backup immediately. '+e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formFields(fields){return fields.map(f=>`<label>${esc(f.label)}<${f.tag||'input'} name="${esc(f.name)}" ${f.tag==='select'?'':`type="${f.type||'text'}"`} ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} ${f.tag==='select'?'':`placeholder="${esc(f.placeholder||'')}"`} >${f.tag==='select'?(f.options||[]).map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')+'</select>':''}</label>`).join('')}
function modalForm(title,fields,onSave){$('#modalTitle').textContent=title;$('#modalFields').innerHTML=formFields(fields);$('#modalForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget));try{onSave(v);persist();modal.close();render()}catch(err){alert(err.message)}};$('#modal').showModal()}
function addProduct(){modalForm('Add product / batch',[{name:'name',label:'Product name',required:true},{name:'company',label:'Company'},{name:'pack',label:'Packing (e.g. 500ml)'},{name:'unit',label:'Unit / Nature',tag:'select',options:['Bottle','ml','Packet','Piece','kg','Gallon','Bag','Drum'].map(x=>[x,x])},{name:'batch',label:'Batch number'},{name:'expiry',label:'Expiry date',type:'date'},{name:'quantity',label:'Opening quantity',type:'number',min:0,step:'1',required:true},{name:'buy',label:'Purchase price (Rs)',type:'number',min:0,step:'any',required:true},{name:'sell',label:'Sale price (Rs)',type:'number',min:0,step:'any',required:true}],v=>{data.products.push({...v,id:id(),quantity:+v.quantity,buy:+v.buy,sell:+v.sell});});}
function addPerson(type){modalForm(type==='customers'?'Add customer':'Add supplier',[{name:'name',label:'Name',required:true},{name:'phone',label:'Phone'},{name:'detail',label:type==='customers'?'Village / address':'Company / address'}],v=>data[type].push({...v,id:id()}))}
function saleModeChanged(){const mode=$('#modalFields [name=mode]')?.value;const c=$('#modalFields [name=customer]');if(c){c.parentElement.style.display=mode==='credit'?'block':'none';c.required=mode==='credit'}}
function purchaseModeChanged(){const mode=$('#modalFields [name=mode]')?.value;const paid=$('#modalFields [name=paid]');if(paid){paid.parentElement.style.display=mode==='credit'?'block':'none'}}
function addSale(){if(!data.products.length)return alert('Please add stock first');modalForm('New Sale / نئی فروخت',[{name:'mode',label:'Sale Type / فروخت کی قسم',tag:'select',options:[['cash','Cash Sale / نقد'],['credit','Credit Sale / ادھار']]},{name:'product',label:'Product / batch',tag:'select',options:data.products.map(x=>[x.id,`${x.name} (${x.quantity} ${x.unit||'units'} available)`])},{name:'customer',label:'Customer for credit sale (add customer with phone in Khata)',tag:'select',options:[['','Choose customer'],...data.customers.map(x=>[x.id,`${x.name} - ${x.phone||'no phone'}`])]},{name:'quantity',label:'Quantity / تعداد',type:'number',min:1,step:'1',required:true},{name:'price',label:'Rate per unit / فی یونٹ قیمت',type:'number',min:0,step:'any',required:true}],v=>{const p=data.products.find(x=>x.id===v.product),q=+v.quantity,price=+v.price;if(!p||!Number.isInteger(q)||q<1||q>p.quantity)throw Error('Invalid quantity or insufficient stock');if(!Number.isFinite(price)||price<0)throw Error('Invalid price');if(v.mode==='credit'&&!v.customer)throw Error('Select a customer for credit sale');if(v.mode==='credit'&&!data.customers.find(x=>x.id===v.customer)?.phone?.trim())throw Error('Please add customer phone in Khata first');const received=v.mode==='cash'?q*price:0;p.quantity-=q;data.sales.push({id:id(),product:p.id,name:p.name,customer:v.mode==='credit'?v.customer:'',quantity:q,price,received,cost:p.buy,mode:v.mode,unit:p.unit||'Unit',date:now()})});const m=$('#modalFields [name=mode]');m.onchange=saleModeChanged;saleModeChanged();}
function addPurchase(){if(!data.products.length||!data.suppliers.length)return alert('Add a product and supplier first');modalForm('New Purchase / خریداری',[{name:'mode',label:'Purchase Type / خریداری کی قسم',tag:'select',options:[['cash','Cash Purchase / نقد'],['credit','Credit Purchase / ادھار']]},{name:'product',label:'Product / batch',tag:'select',options:data.products.map(x=>[x.id,x.name+' / '+(x.batch||'-')])},{name:'supplier',label:'Supplier',tag:'select',options:data.suppliers.map(x=>[x.id,x.name])},{name:'quantity',label:'Quantity added',type:'number',min:1,step:'1',required:true},{name:'cost',label:'Cost per unit',type:'number',min:0,step:'any',required:true},{name:'paid',label:'Advance paid (credit purchase)',type:'number',min:0,step:'any',placeholder:'0'}],v=>{let p=data.products.find(x=>x.id===v.product),q=+v.quantity,c=+v.cost,total=q*c,paid=v.mode==='cash'?total:Number(v.paid||0);if(!p||!Number.isInteger(q)||q<1||!Number.isFinite(c)||c<0||!Number.isFinite(paid)||paid<0||paid>total)throw Error('Invalid purchase amounts');p.quantity+=q;p.buy=c;data.purchases.push({id:id(),product:v.product,supplier:v.supplier,quantity:q,cost:c,paid,mode:v.mode,date:now()})});$('#modalFields [name=mode]').onchange=purchaseModeChanged;purchaseModeChanged();}
function addPayment(type){const arr=data[type==='customer'?'customers':'suppliers'];if(!arr.length)return alert('First add an account');modalForm(type==='customer'?'Receive customer payment':'Pay supplier',[{name:'party',label:'Name',tag:'select',options:arr.map(x=>[x.id,x.name])},{name:'amount',label:'Amount (Rs)',type:'number',min:0.01,step:'any',required:true}],v=>{if(!(+v.amount>0))throw Error('Enter a positive amount');if(+v.amount>balance(type,v.party))throw Error('Payment exceeds remaining balance');data.payments.push({id:id(),type,party:v.party,amount:+v.amount,date:now()})})}
function addExpense(){modalForm('Daily expense',[{name:'amount',label:'Amount (Rs)',type:'number',min:0.01,step:'any',required:true},{name:'note',label:'Details'}],v=>{if(!(+v.amount>0))throw Error('Invalid amount');data.expenses.push({...v,id:id(),amount:+v.amount,date:now()})})}
function balance(type,party){const billed=type==='customer'?data.sales.filter(x=>x.customer===party).reduce((s,x)=>s+x.quantity*x.price-x.received,0):data.purchases.filter(x=>x.supplier===party).reduce((s,x)=>s+x.quantity*x.cost-x.paid,0);const paid=data.payments.filter(x=>x.type===type&&x.party===party).reduce((s,x)=>s+x.amount,0);return Math.max(0,Math.round((billed-paid)*100)/100)}
function cashTotal(end){const before=x=>!end||x.date<end;const saleCash=data.sales.filter(before).reduce((sum,x)=>sum+Number(x.received||0),0);const receiptCash=data.payments.filter(x=>before(x)&&x.type==='customer').reduce((sum,x)=>sum+Number(x.amount||0),0);const buying=data.purchases.filter(before).reduce((sum,x)=>sum+Number(x.paid||0),0);const supplierCash=data.payments.filter(x=>before(x)&&x.type==='supplier').reduce((sum,x)=>sum+Number(x.amount||0),0);const expenses=data.expenses.filter(before).reduce((sum,x)=>sum+Number(x.amount||0),0);return Number(data.openingCash||0)+saleCash+receiptCash-buying-supplierCash-expenses}
function setOpeningCash(){if(data.cashOpeningSet&&!confirm('Change opening cash? This will recalculate cash balance.'))return;const val=prompt('Opening cash / شروع کا گلہ (Rs)',String(data.openingCash||0));if(val===null)return;const n=Number(val);if(!Number.isFinite(n)||n<0)return alert('Enter valid non-negative amount');data.openingCash=n;data.cashOpeningSet=true;persist();render()}
function showAccounts(type){page='khata';render();setTimeout(()=>document.getElementById(type==='customer'?'customerAccounts':'supplierAccounts')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function cashDetail(){const date=dateStr(new Date()),start=date+'T',end=new Date(new Date(date+'T00:00:00').getTime()+86400000).toISOString();const entries=[...data.sales.map(x=>({date:x.date,label:'Cash sale: '+x.name,amount:Number(x.received||0)})),...data.payments.map(x=>({date:x.date,label:x.type==='customer'?'Customer payment':'Supplier payment',amount:(x.type==='customer'?1:-1)*Number(x.amount||0)})),...data.purchases.map(x=>({date:x.date,label:'Purchase',amount:-Number(x.paid||0)})),...data.expenses.map(x=>({date:x.date,label:'Expense: '+(x.note||''),amount:-Number(x.amount||0)}))].filter(x=>x.date>=start&&x.amount!==0).sort((a,b)=>a.date.localeCompare(b.date));const opening=cashTotal(start);$('#root').innerHTML=section('Daily Galla / آج کا گلہ',`<button class="secondary" onclick="render()">← Back</button><p><b>Opening cash: ${money(opening)}</b></p>`+entries.map(x=>line(x.label,new Date(x.date).toLocaleString(),(x.amount<0?'- ':'+ ')+money(Math.abs(x.amount)))).join('')+`<h2>Closing cash: ${money(cashTotal())}</h2><p class="note">Credit sales and unpaid purchases do not change cash until money moves.</p>`)}
function line(title,subtitle,right){return `<div class="item"><span class="right">${esc(right)}</span><strong>${esc(title)}</strong><small>${esc(subtitle)}</small></div>`}function totals(start){const sales=data.sales.filter(x=>x.date>=start),expenses=data.expenses.filter(x=>x.date>=start),purchases=data.purchases.filter(x=>x.date>=start);const revenue=sales.reduce((s,x)=>s+x.quantity*x.price,0),gross=sales.reduce((s,x)=>s+x.quantity*(x.price-x.cost),0),cost=expenses.reduce((s,x)=>s+x.amount,0);return {revenue,gross,expenses:cost,net:gross-cost,purchases:purchases.reduce((s,x)=>s+x.quantity*x.cost,0)}}function tile(label,value,color='',action=''){return `<div class="tile ${action?'clickable':''}" ${action?`onclick="${action}" role="button" tabindex="0"`:''}><span>${esc(label)}</span><b class="${color}">${esc(value)}</b></div>`}const section=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;const dateStr=d=>d.toLocaleDateString('en-CA');function render(){const n=new Date(),day=dateStr(n)+'T',month=dateStr(n).slice(0,7),td=totals(day),tm=totals(month);const nav=[['home','🏠','Home'],['stock','📦','Stock'],['sales','🛒','Sales'],['khata','📒','Khata'],['reports','📊','Reports']];$('#tabs').innerHTML=nav.map(([v,i,l])=>`<button class="${v===page?'active':''}" data-page="${v}">${i}<br>${l}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let html='';if(page==='home'){const low=data.products.filter(x=>x.quantity>0&&x.quantity<5),out=data.products.filter(x=>x.quantity<=0),expired=data.products.filter(x=>x.expiry&&x.expiry<=dateStr(n));const rec=data.customers.reduce((s,x)=>s+balance('customer',x.id),0),pay=data.suppliers.reduce((s,x)=>s+balance('supplier',x.id),0);html=`<div class="tiles">${tile('Galla Cash / گلہ',money(cashTotal()),cashTotal()<0?'red':'green','cashDetail()')}${tile('Net Profit / منافع',money(td.net),'green')}${tile('Account Receivable / وصولی',money(rec),'red',"showAccounts('customer')")}${tile('Account Payable / ادائیگی',money(pay),'blue',"showAccounts('supplier')")}${tile('Low Stock / کم اسٹاک',low.length,'red')}${tile('Out of Stock / ختم اسٹاک',out.length,'red')}</div><br>`+section('Cash Book / گلہ حساب',`<div class="actions"><button onclick="cashDetail()">View Daily Galla</button><button class="secondary" onclick="setOpeningCash()">Set Opening Cash</button></div><p class="note">Cash balance counts cash sales, received payments, cash purchases, supplier payments and expenses. Credit amounts do not change cash.</p>`)+section('Stock alerts',`<p class="red"><b>Low stock under 5: ${low.length} • Out of stock: ${out.length}</b></p><p class="warning">Expired: ${expired.length} batches</p>`+[...out,...low].slice(0,12).map(x=>`<div class="danger-row">${line(x.name,x.batch||'-',`${x.quantity} ${x.unit||'units'}`)}</div>`).join(''))+section('Quick actions','<div class="actions"><button onclick="addSale()">New Sale</button><button class="secondary" onclick="addPurchase()">Purchase</button><button class="secondary" onclick="addExpense()">Expense</button></div>')}
if(page==='stock')html=section('Stock / Inventory','<div class="actions"><button onclick="addProduct()">+ Add Product</button><button class="secondary" onclick="addPurchase()">+ Stock Purchase</button></div>'+(!data.products.length?'<p class="muted">No stock added yet.</p>':data.products.map(x=>line(x.name,`${x.company} • ${x.pack} • Batch ${x.batch||'-'} • Exp ${x.expiry||'-'} • Buy ${money(x.buy)} • Sell ${money(x.sell)}`,`${x.quantity} ${x.unit||'units'}`)).join('')));
if(page==='sales')html=section('Sales','<div class="actions"><button onclick="addSale()">+ New Sale</button></div>'+(!data.sales.length?'<p class="muted">No sales yet.</p>':data.sales.slice().reverse().map(x=>line(x.name,`${x.quantity} × ${money(x.price)} • ${new Date(x.date).toLocaleString()} • Paid ${money(x.received)}`,money(x.quantity*x.price))).join('')));
if(page==='khata')html=section('<span id="customerAccounts">Customer Khata</span>','<div class="actions"><button onclick="addPerson(\'customers\')">+ Customer</button><button class="secondary" onclick="addPayment(\'customer\')">Receive Payment</button></div>'+data.customers.map(x=>line(x.name,`${x.phone||''} • ${x.detail||''}`,money(balance('customer',x.id)))).join('')+'<p class="note">Balance is outstanding customer credit.</p>')+section('<span id="supplierAccounts">Supplier Khata</span>','<div class="actions"><button onclick="addPerson(\'suppliers\')">+ Supplier</button><button class="secondary" onclick="addPayment(\'supplier\')">Pay Supplier</button><button class="secondary" onclick="addPurchase()">Stock Purchase</button></div>'+data.suppliers.map(x=>line(x.name,`${x.phone||''} • ${x.detail||''}`,money(balance('supplier',x.id)))).join(''));
if(page==='reports')html=section('Daily Galla / Cash Book',`<div class="tiles">${tile('Current Cash',money(cashTotal()),cashTotal()<0?'red':'green')}${tile('Cash Opening',money(cashTotal(day)))}</div><div class="actions"><button onclick="cashDetail()">View Cash Entries</button></div>`)+section('Today',`<div class="tiles">${tile('Sales',money(td.revenue))}${tile('Gross profit',money(td.gross))}${tile('Expenses',money(td.expenses))}${tile('Net profit',money(td.net))}</div>`)+section('This month',`<div class="tiles">${tile('Sales',money(tm.revenue))}${tile('Purchases',money(tm.purchases))}${tile('Expenses',money(tm.expenses))}${tile('Net profit',money(tm.net))}</div>`)+section('Balances',`<div class="tiles">${tile('Customer credit',money(data.customers.reduce((s,x)=>s+balance('customer',x.id),0)))}${tile('Supplier payable',money(data.suppliers.reduce((s,x)=>s+balance('supplier',x.id),0)))}${tile('Inventory value',money(data.products.reduce((s,x)=>s+x.quantity*x.buy,0)))}${tile('Total batches',data.products.length)}</div><p class="note">Profit is not the same as cash flow.</p>`)+section('Expenses','<button onclick="addExpense()">+ Add Expense</button>'+data.expenses.slice().reverse().slice(0,15).map(x=>line(x.note||'Expense',new Date(x.date).toLocaleString(),money(x.amount))).join(''))+section('Data & backup',`<p class="bad"><b>Important:</b> Offline data stays in this browser on this device and may be lost if Safari website data is cleared or the app is removed. Export backups frequently.</p><div class="actions"><button onclick="exportData()">Export JSON Backup</button><button class="secondary" onclick="$('#restore').click()">Restore Backup</button></div><input id="restore" type="file" accept="application/json,.json" hidden onchange="restoreData(this)"><p class="note">Exported backups are not encrypted. Keep them private. This first version has no login/PIN and no cloud synchronization.</p>`);
$('#root').innerHTML=html}
function exportData(){const blob=new Blob([JSON.stringify({app:'fazal-rabbi-offline',version:1,data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fazal-backup-'+dateStr(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restoreData(el){const file=el.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(incoming.app!=='fazal-rabbi-offline'||!incoming.data||Object.keys(base()).some(k=>!Array.isArray(incoming.data[k])))throw Error('Unrecognized backup');if(!confirm('Restore will REPLACE all current shop data. Continue?'))return;data=incoming.data;persist();render();alert('Backup restored')}catch(e){alert('Restore failed: '+e.message)}finally{el.value=''}}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(console.warn);render();
</script></body></html>
